[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# پروکسی Firebase برای کاربران ایران (گوگل آی‌پی ایران را مسدود می‌کند) — src/firebase.js
[[redirects]]
  from = "/__fs/*"
  to = "https://firestore.googleapis.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__id/*"
  to = "https://identitytoolkit.googleapis.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__tk/*"
  to = "https://securetoken.googleapis.com/:splat"
  status = 200
  force = true

# صفحات SPA (فایل‌های ساخته‌شده در dist مثل /p/slug اولویت دارند)
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
